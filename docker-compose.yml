services:
  postgres:
    image: postgres:16-alpine
    container_name: shamy-postgres
    restart: always
    environment:
      POSTGRES_USER: shamy
      POSTGRES_PASSWORD: shamy_password
      POSTGRES_DB: shamy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
